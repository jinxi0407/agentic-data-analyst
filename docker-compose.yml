services:
  mysql:
    image: mysql:8.4.3
    container_name: agentic-data-analyst-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
    ports:
      - "127.0.0.1:${MYSQL_PORT}:3306"
    volumes:
      - agentic_data_analyst_mysql_data:/var/lib/mysql
      - ./data/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - agentic_data_analyst_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  agentic_data_analyst_mysql_data:
    name: agentic_data_analyst_mysql_data

networks:
  agentic_data_analyst_net:
    name: agentic_data_analyst_net
